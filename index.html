<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caithan Mark</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #2f2f2f;
      --surface: #3a3a3a;
      --text: #e6e6e6;
      --muted: #a5a5a5;
      --accent: #2f6b55;
      --accent-hover: #3d8068;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      /* Helps prevent the jumping bug by creating a top buffer */
      scroll-padding-top: 80px;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    h1, h2, h3 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    /* --- HAMBURGER MENU & TREE NAVIGATION --- */
    .menu-toggle {
      position: fixed;
      top: 2rem;
      left: 2rem;
      z-index: 2000;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0.5rem;
    }

    .hamburger-line {
      width: 28px;
      height: 2px;
      background: var(--text);
      margin: 6px 0;
      transition: all 0.3s ease;
      border-radius: 2px;
    }

    .menu-toggle.open .hamburger-line:nth-child(1) { transform: rotate(45deg) translate(8px, 8px); }
    .menu-toggle.open .hamburger-line:nth-child(2) { opacity: 0; }
    .menu-toggle.open .hamburger-line:nth-child(3) { transform: rotate(-45deg) translate(7px, -7px); }

    .menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(20, 20, 20, 0.98);
      backdrop-filter: blur(12px);
      z-index: 1999;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .menu-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .menu-nav {
      list-style: none;
      text-align: left;
      width: 320px;
    }

    .menu-nav > li {
      margin: 1.5rem 0;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.4s ease;
    }

    .menu-overlay.open .menu-nav > li { opacity: 1; transform: translateY(0); }
    .menu-overlay.open .menu-nav > li:nth-child(1) { transition-delay: 0.1s; }
    .menu-overlay.open .menu-nav > li:nth-child(2) { transition-delay: 0.2s; }
    .menu-overlay.open .menu-nav > li:nth-child(3) { transition-delay: 0.3s; }

    .menu-link, .gallery-parent {
      font-size: 2.2rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      color: var(--text);
      cursor: pointer;
    }

    /* --- REFINED SUBMENU TREE STYLES --- */
    .gallery-submenu {
      position: relative;
      margin-left: 1.25rem;
      padding-left: 1.25rem;
      margin-top: 0.5rem;
    }

    /* Vertical Spine */
    .gallery-submenu::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0.8rem;
      left: 0;
      width: 1px;
      background: rgba(255, 255, 255, 0.18);
    }

    /* Submenu Items */
    .gallery-submenu a {
      position: relative;
      display: block;
      padding: 0.35rem 0 0.35rem 1.2rem;
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
      transition: color 0.2s ease, transform 0.2s ease;
      cursor: pointer;
    }

    /* Horizontal Ticks */
    .gallery-submenu a::before {
      content: "";
      position: absolute;
      left: -1.25rem;
      top: 50%;
      width: 1.25rem;
      height: 1px;
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-50%);
    }

    .gallery-submenu a:hover {
      color: #ffffff;
      transform: translateX(4px);
    }

    /* --- HERO & READABILITY FIX --- */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
    }

    @keyframes fadeIn { to { opacity: 1; } }

    .hero img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.75); /* Darkens the image slightly to help text pop */
    }

    .hero-content {
      position: relative;
      z-index: 2;
      padding: 8rem 2rem 5rem;
      width: 100%;
      text-align: center;
      /* Gentle dark protection gradient for text */
      background: linear-gradient(
        to top, 
        rgba(0, 0, 0, 0.85) 0%, 
        rgba(0, 0, 0, 0.4) 50%, 
        rgba(0, 0, 0, 0) 100%
      );
    }

    .hero-content h1 {
      margin: 0 0 1rem 0;
      font-size: clamp(2.5rem, 7vw, 4.5rem);
      letter-spacing: 0.1em;
      color: #ffffff;
      /* Subtle shadow makes letters legible even against bright spots */
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.6);
    }

    .hero-content p {
      max-width: 600px;
      margin: 0 auto 2rem;
      color: var(--text);
      font-size: 1.1rem;
      font-weight: 300;
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.5);
    }

    .cta-button {
      display: inline-block;
      padding: 0.9rem 2.2rem;
      background: var(--accent);
      color: var(--text);
      border-radius: 4px;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .cta-button:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }

    /* --- GALLERY GRID --- */
    #gallery { padding: 6rem 2rem; min-height: 100vh; }
    .gallery-container { max-width: 1400px; margin: 0 auto; }
    .gallery { column-count: 3; column-gap: 1.5rem; }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: 1.5rem;
      background: var(--surface);
      border-radius: 4px;
      overflow: hidden;
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.6s ease-out;
    }

    .gallery-item.visible { opacity: 1; transform: translateY(0); }
    .gallery-item img { width: 100%; display: block; transition: 0.5s; }
    .gallery-item:hover img { transform: scale(1.02); }

    /* --- CONTACT --- */
    #contact { padding: 10rem 2rem; text-align: center; }
    #contact a { font-size: 1.2rem; border-bottom: 1px solid var(--accent); color: var(--text); }

    footer { padding: 4rem; text-align: center; font-size: 0.8rem; color: #666; }

    /* Lightbox Styles */
    .lightbox {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95);
      z-index: 3000; align-items: center; justify-content: center;
    }
    .lightbox.active { display: flex; }
    .lightbox img { max-width: 90%; max-height: 80vh; }
    .close-btn { position: absolute; top: 2rem; right: 2rem; color: white; font-size: 3rem; cursor: pointer; background: none; border: none; }

    @media (max-width: 900px) { .gallery { column-count: 2; } }
    @media (max-width: 600px) { .gallery { column-count: 1; } }
  </style>
</head>
<body>

  <button class="menu-toggle" id="menu-toggle">
    <div class="hamburger-line"></div>
    <div class="hamburger-line"></div>
    <div class="hamburger-line"></div>
  </button>

  <div class="menu-overlay" id="menu-overlay">
    <ul class="menu-nav">
      <li><a href="#home" class="menu-link" onclick="closeMenu()">Home</a></li>
      <li>
        <div class="gallery-parent" onclick="filterFromMenu('all')">Gallery</div>
        <div class="gallery-submenu">
          <a onclick="filterFromMenu('landscape')">Landscape</a>
          <a onclick="filterFromMenu('abstract')">Abstract</a>
          <a onclick="filterFromMenu('nature')">Nature</a>
        </div>
      </li>
      <li><a href="#contact" class="menu-link" id="contact-trigger">Contact</a></li>
    </ul>
  </div>

  <section class="hero" id="home">
    <img src="images/water.jpg" alt="Main photograph">
    <div class="hero-content">
      <h1>Caithan Mark</h1>
      <p>I use photography as a way to focus on the composition and form of the world</p>
      <a href="#gallery" class="cta-button">View Work</a>
    </div>
  </section>

  <section id="gallery">
    <div class="gallery-container">
      <div class="gallery" id="gallery-grid">
        <div class="gallery-item" data-category="landscape"><img src="images/sunrise.jpg" alt="sunrise"></div>
        <div class="gallery-item" data-category="nature"><img src="images/bird.jpg" alt="bird"></div>
        <div class="gallery-item" data-category="abstract"><img src="images/water2.jpg" alt="water2"></div>
        <div class="gallery-item" data-category="landscape"><img src="images/boat_launch.jpg" alt="boat"></div>
        <div class="gallery-item" data-category="nature"><img src="images/fern.jpg" alt="fern"></div>
        <div class="gallery-item" data-category="landscape"><img src="images/road.jpg" alt="road"></div>
        </div>
    </div>
  </section>

  <section id="contact">
    <h2>Get in Touch</h2>
    <p style="margin: 1.5rem 0; color: var(--muted);">Available for commissions and collaborations.</p>
    <a href="mailto:precept_38fellow@icloud.com">email</a>
  </section>

  <footer>&copy; 2025 Caithan Mark. All rights reserved.</footer>

  <div class="lightbox" id="lightbox">
    <button class="close-btn">&times;</button>
    <img src="" id="lightbox-img">
  </div>

  <script>
    const menuToggle = document.getElementById('menu-toggle');
    const menuOverlay = document.getElementById('menu-overlay');

    function closeMenu() {
      menuToggle.classList.remove('open');
      menuOverlay.classList.remove('open');
      document.body.style.overflow = 'auto';
    }

    menuToggle.addEventListener('click', () => {
      menuToggle.classList.toggle('open');
      menuOverlay.classList.toggle('open');
      document.body.style.overflow = menuOverlay.classList.contains('open') ? 'hidden' : 'auto';
    });

    // SMART SCROLL FOR CONTACT
    document.getElementById('contact-trigger').addEventListener('click', (e) => {
      e.preventDefault();
      closeMenu();
      const target = document.getElementById('contact');
      target.scrollIntoView({ behavior: 'smooth' });
      
      // Secondary anchor fix for lazy-loading images
      setTimeout(() => {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 600);
    });

    function filterFromMenu(cat) {
      closeMenu();
      document.getElementById('gallery').scrollIntoView({ behavior: 'smooth' });
      // Insert your filter logic here if needed
    }

    // Scroll reveal observer
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, { threshold: 0.1 });

    document.querySelectorAll('.gallery-item').forEach(item => observer.observe(item));

    // Simple Lightbox Logic
    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lightbox-img');
    document.querySelectorAll('.gallery-item img').forEach(img => {
      img.onclick = () => {
        lbImg.src = img.src;
        lb.classList.add('active');
      };
    });
    document.querySelector('.close-btn').onclick = () => lb.classList.remove('active');
  </script>
</body>
</html>
