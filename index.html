<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Risible Alias</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #2f2f2f;
      --surface: #3a3a3a;
      --text: #e6e6e6;
      --muted: #a5a5a5;
      --accent: #2f6b55;
      --accent-hover: #3d8068;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      /* This is the secret to fixing the jumping bug. It forces the browser 
         to respect a margin when navigating to IDs like #contact. */
      scroll-padding-top: 100px; 
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    h1, h2, h3 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    /* --- HAMBURGER MENU & YOUR NEW TREE STYLES --- */
    .menu-toggle {
      position: fixed;
      top: 2rem;
      left: 2rem;
      z-index: 2000;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0.5rem;
    }

    .hamburger-line {
      width: 28px;
      height: 2px;
      background: var(--text);
      margin: 6px 0;
      transition: all 0.3s ease;
      border-radius: 2px;
    }

    .menu-toggle.open .hamburger-line:nth-child(1) { transform: rotate(45deg) translate(8px, 8px); }
    .menu-toggle.open .hamburger-line:nth-child(2) { opacity: 0; }
    .menu-toggle.open .hamburger-line:nth-child(3) { transform: rotate(-45deg) translate(7px, -7px); }

    .menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(20, 20, 20, 0.98);
      backdrop-filter: blur(12px);
      z-index: 1999;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .menu-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .menu-nav {
      list-style: none;
      text-align: left;
      width: 320px;
    }

    .menu-nav > li {
      margin: 1.5rem 0;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.4s ease;
    }

    .menu-overlay.open .menu-nav > li { opacity: 1; transform: translateY(0); }
    .menu-overlay.open .menu-nav > li:nth-child(1) { transition-delay: 0.1s; }
    .menu-overlay.open .menu-nav > li:nth-child(2) { transition-delay: 0.2s; }
    .menu-overlay.open .menu-nav > li:nth-child(3) { transition-delay: 0.3s; }

    .menu-link, .gallery-parent {
      font-size: 2.2rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      color: var(--text);
      cursor: pointer;
    }

    /* --- INTEGRATED SUBMENU STYLES --- */
    .gallery-submenu {
      position: relative;
      margin-left: 1.25rem;
      padding-left: 1.25rem;
      margin-top: 0.5rem;
    }

    /* vertical spine */
    .gallery-submenu::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0.8rem; /* End slightly early for the last tick */
      left: 0;
      width: 1px;
      background: rgba(255, 255, 255, 0.18);
    }

    /* submenu items */
    .gallery-submenu a {
      position: relative;
      display: block;
      padding: 0.35rem 0 0.35rem 1.2rem;
      font-size: 1rem; /* Slightly larger for readability */
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
      transition: color 0.2s ease, transform 0.2s ease;
      cursor: pointer;
    }

    /* horizontal tick */
    .gallery-submenu a::before {
      content: "";
      position: absolute;
      left: -1.25rem; /* Reaches back to the vertical spine */
      top: 50%;
      width: 1.25rem;
      height: 1px;
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-50%);
    }

    .gallery-submenu a:hover {
      color: #e6e6e6;
      transform: translateX(4px);
    }

    /* --- GALLERY GRID --- */
    #gallery {
      padding: 4rem 2rem;
      min-height: 100vh;
    }

    .gallery-container { max-width: 1400px; margin: 0 auto; }
    .gallery { column-count: 3; column-gap: 1.5rem; }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: 1.5rem;
      background: var(--surface);
      border-radius: 4px;
      overflow: hidden;
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.6s ease-out;
    }

    .gallery-item.visible { opacity: 1; transform: translateY(0); }
    .gallery-item img { width: 100%; display: block; filter: grayscale(20%); transition: 0.5s; }
    .gallery-item:hover img { filter: grayscale(0%); transform: scale(1.02); }

    /* --- CONTACT --- */
    #contact {
      padding: 10rem 2rem;
      text-align: center;
      background: rgba(0,0,0,0.1);
    }

    footer { padding: 4rem; text-align: center; font-size: 0.8rem; color: #666; }

    /* Lightbox Styles (Standard) */
    .lightbox {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95);
      z-index: 3000; align-items: center; justify-content: center;
    }
    .lightbox.active { display: flex; }
    .lightbox img { max-width: 90%; max-height: 80vh; }
    .close-btn { position: absolute; top: 2rem; right: 2rem; color: white; font-size: 3rem; cursor: pointer; background: none; border: none; }
  </style>
</head>
<body>

  <button class="menu-toggle" id="menu-toggle">
    <div class="hamburger-line"></div>
    <div class="hamburger-line"></div>
    <div class="hamburger-line"></div>
  </button>

  <div class="menu-overlay" id="menu-overlay">
    <ul class="menu-nav">
      <li><a href="#home" class="menu-link" onclick="closeMenu()">Home</a></li>
      <li>
        <div class="gallery-parent" onclick="filterFromMenu('all')">Gallery (All)</div>
        <div class="gallery-submenu">
          <a onclick="filterFromMenu('landscape')">Landscape</a>
          <a onclick="filterFromMenu('abstract')">Abstract</a>
          <a onclick="filterFromMenu('nature')">Nature</a>
        </div>
      </li>
      <li><a href="#contact" class="menu-link" id="contact-trigger">Contact</a></li>
    </ul>
  </div>

  <section id="home" style="height: 60vh; display: flex; align-items: center; justify-content: center; text-align: center;">
    <div>
      <h1>Risible Alias</h1>
      <p style="color: var(--muted); margin-top: 1rem;">Photographic Portfolio</p>
    </div>
  </section>

  <section id="gallery">
    <div class="gallery-container">
      <div class="gallery" id="gallery-grid">
        <div class="gallery-item" data-category="landscape"><img src="images/sunrise.jpg" alt="sunrise" loading="lazy"></div>
        <div class="gallery-item" data-category="nature"><img src="images/bird.jpg" alt="bird" loading="lazy"></div>
        <div class="gallery-item" data-category="abstract"><img src="images/water2.jpg" alt="water2" loading="lazy"></div>
        <div class="gallery-item" data-category="landscape"><img src="images/boat_launch.jpg" alt="boat" loading="lazy"></div>
        <div class="gallery-item" data-category="nature"><img src="images/fern.jpg" alt="fern" loading="lazy"></div>
        <div class="gallery-item" data-category="landscape"><img src="images/road.jpg" alt="road" loading="lazy"></div>
        </div>
    </div>
  </section>

  <section id="contact">
    <h2>Connect</h2>
    <p style="margin: 1.5rem 0; color: var(--muted);">Available for commissions and collaborations.</p>
    <a href="mailto:alias@example.com" style="font-size: 1.2rem; border-bottom: 1px solid var(--accent);">alias@example.com</a>
  </section>

  <footer>&copy; 2025 Risible Alias</footer>

  <div class="lightbox" id="lightbox">
    <button class="close-btn">&times;</button>
    <img src="" id="lightbox-img">
  </div>

  <script>
    const menuToggle = document.getElementById('menu-toggle');
    const menuOverlay = document.getElementById('menu-overlay');

    function closeMenu() {
      menuToggle.classList.remove('open');
      menuOverlay.classList.remove('open');
      document.body.style.overflow = 'auto';
    }

    menuToggle.addEventListener('click', () => {
      menuToggle.classList.toggle('open');
      menuOverlay.classList.toggle('open');
      document.body.style.overflow = menuOverlay.classList.contains('open') ? 'hidden' : 'auto';
    });

    // --- SMART SCROLL FOR CONTACT ---
    document.getElementById('contact-trigger').addEventListener('click', (e) => {
      e.preventDefault();
      closeMenu();
      
      const target = document.getElementById('contact');
      target.scrollIntoView({ behavior: 'smooth' });

      // After a short delay, we verify the scroll position. If images loaded and 
      // pushed the section, we re-anchor it.
      setTimeout(() => {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 600);
    });

    function filterFromMenu(cat) {
      closeMenu();
      document.getElementById('gallery').scrollIntoView({ behavior: 'smooth' });
      // Trigger gallery filter logic here...
    }

    // Scroll reveal observer
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, { threshold: 0.1 });

    document.querySelectorAll('.gallery-item').forEach(item => observer.observe(item));

    // Lightbox Logic
    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lightbox-img');
    document.querySelectorAll('.gallery-item img').forEach(img => {
      img.onclick = () => {
        lbImg.src = img.src;
        lb.classList.add('active');
      };
    });
    document.querySelector('.close-btn').onclick = () => lb.classList.remove('active');
  </script>
</body>
</html>
